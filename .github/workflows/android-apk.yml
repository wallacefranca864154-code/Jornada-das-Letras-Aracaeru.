name: Gerar APK Jornada das Letras

on:
  workflow_dispatch:
  push:
    branches: [main, principal]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'Jornada_das_Letras_Aracaeru_V6_Projeto_Android.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto Android
        run: |
          unzip -q Jornada_das_Letras_Aracaeru_V6_Projeto_Android.zip -d projeto
          test -f projeto/Aracaeru_Android_Projeto/app/build.gradle

      - name: Compilar APK
        working-directory: projeto/Aracaeru_Android_Projeto
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jornada-das-Letras-Aracaeru-APK
          path: projeto/Aracaeru_Android_Projeto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
